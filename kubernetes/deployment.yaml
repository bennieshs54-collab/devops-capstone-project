apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-capstone-app
  namespace: devops
spec:
  replicas: 2

  selector:
    matchLabels:
      app: devops-capstone-app

  template:
    metadata:
      labels:
        app: devops-capstone-app

    spec:
      containers:
        - name: devops-capstone-app

          image: 565905128323.dkr.ecr.ap-south-1.amazonaws.com/devops-capstone-app:1.0

          ports:
            - containerPort: 3000

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20