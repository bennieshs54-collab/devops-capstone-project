---
- name: Configure Jenkins Support Server
  hosts: jenkins
  become: true

  tasks:

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install required packages
      apt:
        name:
          - git
          - curl
          - wget
          - unzip
          - ca-certificates
          - gnupg
          - software-properties-common
          - python3
          - python3-pip
        state: present

    - name: Install Docker
      apt:
        name:
          - docker.io
        state: present

    - name: Enable Docker service
      systemd:
        name: docker
        enabled: yes
        state: started

    - name: Add ubuntu user to Docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Check AWS CLI
      command: aws --version
      register: aws_version
      changed_when: false
      failed_when: false

    - name: Display AWS CLI version
      debug:
        msg: "{{ aws_version.stdout }}"

    - name: Check kubectl
      command: kubectl version --client
      register: kubectl_version
      changed_when: false
      failed_when: false

    - name: Display kubectl version
      debug:
        msg: "{{ kubectl_version.stdout }}"

    - name: Check Docker
      command: docker --version
      register: docker_version
      changed_when: false

    - name: Display Docker version
      debug:
        msg: "{{ docker_version.stdout }}"